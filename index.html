<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여정 — 제주 스마트 동선 플래너</title>
<style>
:root {
  --bg:#F7F4EF; --sf:#fff; --ink:#1A1714; --ink2:#6B6560; --ink3:#B0AAA4;
  --acc:#C8512A; --acc2:#3E6B4A; --bdr:#E4DED7; --tag:#EDE8E2;
  --sh:0 2px 14px rgba(26,23,20,.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:sans-serif;background:var(--bg);color:var(--ink);}
body{display:flex;flex-direction:column;}
.hdr{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--sf);border-bottom:1px solid var(--bdr);flex-shrink:0;}
.logo{font-family:Georgia,serif;font-size:20px;font-weight:700;letter-spacing:-.5px;}
.logo b{color:var(--acc);}
.logo-s{font-size:11px;color:var(--ink3);margin-top:1px;}
.api-row{margin-left:auto;display:flex;align-items:center;gap:7px;}
.api-box{display:flex;align-items:center;gap:0;border:1.5px solid var(--bdr);border-radius:9px;overflow:hidden;background:var(--bg);}
.api-inp{padding:7px 11px;border:none;font-size:12px;background:transparent;color:var(--ink);width:210px;outline:none;}
.api-inp::placeholder{color:var(--ink3);}
.api-test{padding:7px 12px;background:var(--tag);border:none;border-left:1px solid var(--bdr);font-size:12px;cursor:pointer;color:var(--ink2);white-space:nowrap;}
.api-test:hover{background:var(--bdr);}
.kbdg{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--tag);color:var(--ink3);white-space:nowrap;}
.kbdg.live{background:#EBF3EF;color:#2E6644;}
.kbdg.err{background:#FDF0EB;color:#994020;}
.app{display:grid;grid-template-columns:340px 1fr;flex:1;overflow:hidden;}
.left{background:var(--sf);border-right:1px solid var(--bdr);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;}
.slbl{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;}
.dvd{height:1px;background:var(--bdr);}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.chip{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:10px;border:1.5px solid var(--bdr);cursor:pointer;background:transparent;transition:all .14s;}
.chip:hover{border-color:var(--acc);background:#FDF0EB;}
.chip.on{border-color:var(--acc);background:#FDF0EB;}
.chip-i{font-size:18px;}
.chip-l{font-size:10px;color:var(--ink2);}
.chip.on .chip-l{color:var(--acc);font-weight:700;}

/* 제주 4권역 탭 */
.zone-tabs{display:flex;gap:4px;flex-wrap:wrap;}
.ztab{flex:1;padding:7px 4px;font-size:11px;border-radius:8px;border:1.5px solid var(--bdr);background:transparent;cursor:pointer;color:var(--ink2);transition:all .14s;text-align:center;}
.ztab:hover{border-color:var(--acc2);background:#EBF3EF;}
.ztab.on{border-color:var(--acc2);background:#EBF3EF;color:var(--acc2);font-weight:700;}
.ztab.all-on{border-color:var(--ink);background:var(--ink);color:#fff;}
.zone-badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:10px;margin-left:3px;}

.ct-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px;}
.cchip{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--bdr);background:transparent;color:var(--ink2);cursor:pointer;transition:all .12s;}
.cchip.on{background:var(--acc2);border-color:var(--acc2);color:#fff;}
.sr{display:flex;gap:5px;}
.inp{width:100%;padding:8px 11px;border:1.5px solid var(--bdr);border-radius:9px;font-size:13px;background:var(--bg);color:var(--ink);outline:none;transition:border-color .14s;appearance:none;}
.inp:focus{border-color:var(--acc);}
.btnp{padding:8px 11px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;background:var(--acc);color:#fff;transition:opacity .14s;white-space:nowrap;}
.btnp:hover{opacity:.88;}
.btns{padding:8px 10px;border-radius:8px;border:1px solid var(--bdr);font-size:12px;cursor:pointer;background:transparent;color:var(--ink2);white-space:nowrap;}
.btns:hover{background:var(--tag);}
.stt{font-size:11px;color:var(--ink3);min-height:0;margin:2px 0;display:none;}
.stt.err{color:#994020;}
.stt.ok{color:#2E6644;}
.slist{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.si{display:flex;align-items:flex-start;gap:7px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--bdr);cursor:pointer;background:var(--bg);transition:all .12s;}
.si:hover{border-color:var(--acc2);background:#EBF3EF;}
.si.on{border-color:var(--acc2);background:#EBF3EF;}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--bdr);flex-shrink:0;margin-top:4px;}
.si.on .sdot{background:var(--acc2);}
.sn{font-size:12px;flex:1;line-height:1.3;}
.sc{font-size:10px;color:var(--ink3);}
.szn{font-size:9px;padding:1px 5px;border-radius:8px;display:inline-block;margin-top:2px;}
.bdgs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.bdg{font-size:11px;padding:3px 8px;border-radius:20px;background:#EBF3EF;border:1px solid #A8D0B5;color:#2E6644;display:flex;align-items:center;gap:3px;}
.bdg button{background:none;border:none;cursor:pointer;color:#2E6644;font-size:13px;padding:0;line-height:1;}
.bdot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.plist{display:flex;flex-direction:column;gap:3px;}
.prow{display:flex;align-items:center;gap:8px;padding:3px 0;}
.plbl{font-size:12px;flex:1;}
.pbtns{display:flex;gap:3px;}
.pbtn{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--bdr);background:transparent;cursor:pointer;font-size:10px;font-weight:700;color:var(--ink3);transition:all .12s;}
.pbtn.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.ntc{font-size:11px;line-height:1.6;padding:9px 12px;border-radius:8px;background:#FDF0EB;border:1px solid #F0B99A;color:#994020;}
.ntc.live{background:#EBF3EF;border-color:#A8D0B5;color:#2E6644;}
.gbtn{width:100%;padding:13px;background:var(--ink);color:#fff;border:none;border-radius:11px;font-family:Georgia,serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .18s;}
.gbtn:hover{background:var(--acc);transform:translateY(-1px);}
.right{display:flex;flex-direction:column;overflow:hidden;}
.tabs{display:flex;border-bottom:1px solid var(--bdr);background:var(--sf);padding:0 18px;flex-shrink:0;}
.tab{padding:12px 16px;font-size:13px;background:none;border:none;border-bottom:2px solid transparent;color:var(--ink3);cursor:pointer;transition:all .13s;margin-bottom:-1px;}
.tab.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:700;}
.pane{flex:1;overflow:hidden;display:none;flex-direction:column;}
.pane.on{display:flex;}
.mapwrap{flex:1;position:relative;background:#E4EFF5;overflow:hidden;min-height:300px;}
.map-svg{width:100%;height:100%;display:block;}
.mempty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--ink3);background:rgba(228,239,245,0.92);z-index:2;}
.mempty-i{font-size:40px;opacity:.2;}
.mempty-t{font-family:Georgia,serif;font-size:17px;}
.mempty-s{font-size:12px;line-height:1.7;}
.mleg{background:var(--sf);border-top:1px solid var(--bdr);padding:7px 16px;display:none;flex-wrap:wrap;gap:10px;flex-shrink:0;}
.detail-popup{position:absolute;background:var(--sf);border:1px solid var(--bdr);border-radius:12px;padding:12px 14px;width:220px;z-index:10;box-shadow:0 4px 20px rgba(0,0,0,.15);pointer-events:none;display:none;}
.detail-popup.show{display:block;}
.dp-name{font-size:13px;font-weight:700;margin-bottom:4px;}
.dp-type{font-size:10px;color:var(--ink3);margin-bottom:6px;}
.dp-tip{font-size:11px;color:var(--ink2);line-height:1.5;}
.dp-close{position:absolute;top:8px;right:10px;background:none;border:none;cursor:pointer;font-size:14px;color:var(--ink3);pointer-events:all;}
.mleg.on{display:flex;}
.lgi{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);cursor:pointer;}
.lgi:hover{color:var(--acc);}
.lgd{width:10px;height:10px;border-radius:50%;}
.tlscroll{flex:1;overflow-y:auto;padding:20px 22px;}
.tlempty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;text-align:center;color:var(--ink3);}
.tlempty-i{font-size:38px;opacity:.2;}
.tlempty-t{font-family:Georgia,serif;font-size:17px;}
.tlempty-s{font-size:12px;line-height:1.7;}
.ld{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;}
.ld.on{display:flex;}
.spin{width:34px;height:34px;border:3px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin .75s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.lsteps{display:flex;flex-direction:column;gap:5px;align-items:center;}
.ls{font-size:12px;color:var(--ink3);transition:color .3s;}
.ls.on{color:var(--acc);font-weight:700;}
.res-t{font-family:Georgia,serif;font-size:21px;font-weight:700;letter-spacing:-.5px;}
.res-s{font-size:12px;color:var(--ink3);margin:3px 0 14px;}
.wbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sf);border:1px solid var(--bdr);border-radius:10px;padding:10px 14px;margin-bottom:16px;}
.wi{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);}
.tl{display:flex;flex-direction:column;}
.trow{display:flex;gap:12px;}
.tleft{display:flex;flex-direction:column;align-items:center;width:28px;flex-shrink:0;}
.tnum{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}
.tline{flex:1;width:2px;background:var(--bdr);margin:3px 0;min-height:12px;}
.tcard{background:var(--sf);border:1px solid var(--bdr);border-radius:12px;padding:11px 15px;margin-bottom:8px;flex:1;cursor:pointer;transition:all .13s;}
.tcard:hover{box-shadow:var(--sh);}
.tcard.hl{border-color:var(--acc);box-shadow:0 0 0 3px rgba(200,81,42,.1);}
.ttop{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;}
.tname{font-size:14px;font-weight:700;}
.ttime{font-size:10px;color:var(--ink3);background:var(--tag);padding:2px 7px;border-radius:5px;}
.taddr{font-size:11px;color:var(--ink3);margin-bottom:6px;}
.ttags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px;}
.ttag{font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid var(--bdr);color:var(--ink2);background:var(--tag);}
.ttag.g{background:#EBF3EF;border-color:#A8D0B5;color:#2E6644;}
.ttag.w{background:#FDF0EB;border-color:#F0B99A;color:#994020;}
.ttip{font-size:11px;color:var(--ink2);line-height:1.6;padding-top:6px;border-top:1px solid var(--bdr);}
.trr{display:flex;align-items:center;gap:5px;padding:2px 0 2px 40px;font-size:11px;color:var(--ink3);}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:16px;}
.sc2{background:var(--sf);border:1px solid var(--bdr);border-radius:10px;padding:10px 12px;}
.snum{font-size:18px;font-weight:700;}
.slb{font-size:10px;color:var(--ink3);margin-top:1px;}
/* 권역 구분선 */
.zone-divider{display:flex;align-items:center;gap:8px;margin:8px 0 4px;font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--ink3);}
.zone-divider::before,.zone-divider::after{content:'';flex:1;height:1px;background:var(--bdr);}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:10px;}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="logo">여<b>정</b></div>
    <div class="logo-s">한국관광공사 TourAPI 기반 제주 스마트 동선 플래너</div>
  </div>
  <div class="api-row">
    <div class="api-box">
      <input class="api-inp" id="apiInp" type="password" placeholder="TourAPI 인증키(디코딩) 입력..." oninput="onKey(this.value)" style="display:none">
      <button class="api-test" onclick="testKey()" style="display:none">연결 확인</button>
    </div>
    <span class="kbdg live" id="kbdg">TourAPI 연결됨</span>
  </div>
</div>

<div class="app">
  <div class="left">
    <div>
      <div class="slbl">동반자</div>
      <div class="cgrid">
        <button class="chip" data-v="solo"    onclick="pick(this,'companion')"><span class="chip-i">🧍</span><span class="chip-l">혼자</span></button>
        <button class="chip" data-v="couple"  onclick="pick(this,'companion')"><span class="chip-i">👫</span><span class="chip-l">커플</span></button>
        <button class="chip" data-v="friends" onclick="pick(this,'companion')"><span class="chip-i">👯</span><span class="chip-l">친구</span></button>
        <button class="chip" data-v="family"  onclick="pick(this,'companion')"><span class="chip-i">👨‍👩‍👧</span><span class="chip-l">가족</span></button>
        <button class="chip" data-v="pet"     onclick="pick(this,'companion')"><span class="chip-i">🐶</span><span class="chip-l">반려동물</span></button>
        <button class="chip" data-v="senior"  onclick="pick(this,'companion')"><span class="chip-i">👴</span><span class="chip-l">어르신</span></button>
      </div>
    </div>
    <div class="dvd"></div>
    <div>
      <div class="slbl">제주 권역 선택</div>
      <div class="zone-tabs">
        <button class="ztab all-on" data-z="all" onclick="pickZone(this)">전체</button>
        <button class="ztab" data-z="east" onclick="pickZone(this)">동부<span class="zone-badge" style="background:#FDF0EB;color:#C8512A;">성산·우도</span></button>
        <button class="ztab" data-z="west" onclick="pickZone(this)">서부<span class="zone-badge" style="background:#EBF3EF;color:#2E6644;">협재·한림</span></button>
        <button class="ztab" data-z="south" onclick="pickZone(this)">남부<span class="zone-badge" style="background:#E8EEF8;color:#3B5FA0;">서귀포</span></button>
        <button class="ztab" data-z="halla" onclick="pickZone(this)">한라<span class="zone-badge" style="background:#EDE8E2;color:#6B6560;">중산간</span></button>
      </div>
    </div>
    <div>
      <div class="slbl">명소 유형</div>
      <div class="ct-row">
        <button class="cchip on" data-ct="12" onclick="toggleCt(this)">관광지</button>
        <button class="cchip on" data-ct="14" onclick="toggleCt(this)">문화시설</button>
        <button class="cchip on" data-ct="15" onclick="toggleCt(this)">축제/행사</button>
        <button class="cchip on" data-ct="28" onclick="toggleCt(this)">레포츠</button>
        <button class="cchip on" data-ct="38" onclick="toggleCt(this)">쇼핑</button>
        <button class="cchip on" data-ct="39" onclick="toggleCt(this)">음식점</button>
      </div>
      <div class="sr">
        <input class="inp" id="qInp" placeholder="명소 이름 검색..." onkeydown="if(event.key==='Enter')doSearch()">
        <button class="btnp" onclick="doSearch()">검색</button>
        <button class="btns" onclick="doArea()">전체</button>
      </div>
      <div class="stt" id="stt"></div>
      <div class="slist" id="slist"></div>
      <div class="bdgs" id="bdgs"></div>
    </div>
    <div class="dvd"></div>
    <div>
      <div class="slbl">여행 날짜</div>
      <input type="date" class="inp" id="dateInp">
    </div>
    <div>
      <div class="slbl">고려사항 우선순위 (1낮음 · 3높음)</div>
      <div class="plist" id="plist"></div>
    </div>
    <div class="dvd"></div>
    <div class="ntc live" id="ntc">
      ✓ <strong>TourAPI 실데이터 연동됨</strong> — 한국관광공사 OpenAPI 기반 제주 관광 데이터를 실시간으로 제공합니다.
    </div>
    <button class="gbtn" onclick="generate()">동선 생성 + 지도 보기 →</button>
  </div>

  <div class="right">
    <div class="tabs">
      <button class="tab on" id="tabMap" onclick="showTab('map',this)">🗺 지도 동선</button>
      <button class="tab" id="tabTl" onclick="showTab('tl',this)">📋 타임라인</button>
    </div>
    <div class="pane on" id="pane-map">
      <div class="mapwrap">
        <div class="mempty" id="mempty">
          <div class="mempty-i">🗺️</div>
          <div class="mempty-t">동선을 생성하면 제주 지도가 표시됩니다</div>
          <div class="mempty-s">권역과 명소를 선택 후<br>동선 생성 버튼을 누르세요</div>
        </div>
        <div class="detail-popup" id="detailPopup"><button class="dp-close" onclick="closePopup()">×</button><div class="dp-name" id="dpName"></div><div class="dp-type" id="dpType"></div><div class="dp-tip" id="dpTip"></div></div>
        <svg class="map-svg" id="msvg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="isl-sh"><feDropShadow dx="3" dy="4" stdDeviation="7" flood-color="rgba(0,80,160,0.2)"/></filter>
    <linearGradient id="sea-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B5D5EE"/>
      <stop offset="100%" stop-color="#C5E0F5"/>
    </linearGradient>
    <linearGradient id="land-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8EAC2"/>
      <stop offset="100%" stop-color="#C8DFB0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sea-g)"/>
  <text x="55" y="50" font-size="11" fill="#90C0E0" font-family="sans-serif" opacity=".65">제 주 해 협</text>
  <text x="55" y="475" font-size="11" fill="#90C0E0" font-family="sans-serif" opacity=".65">남 해</text>
  <text x="720" y="475" font-size="11" fill="#90C0E0" font-family="sans-serif" opacity=".65">태평양</text>
  <path d="M59,105 L72,101 L89,97 L106,93 L126,90 L143,86 L161,82 L182,78 L202,74 L224,71 L248,68 L270,65 L294,62 L319,60 L344,58 L370,59 L394,62 L416,65 L438,68 L460,72 L482,74 L505,75 L529,78 L551,81 L573,86 L595,91 L615,97 L636,105 L654,115 L673,125 L690,137 L704,150 L717,121 L732,128 L736,142 L731,156 L721,169 L707,183 L693,197 L679,211 L663,226 L645,241 L628,256 L610,273 L592,288 L571,302 L551,316 L529,328 L505,338 L480,347 L455,354 L427,359 L400,362 L373,364 L346,364 L319,362 L292,361 L265,361 L238,362 L211,366 L184,371 L158,376 L133,380 L107,381 L84,379 L63,375 L46,367 L38,355 L31,340 L28,323 L28,305 L31,286 L36,267 L41,247 L46,227 L50,207 L52,186 L53,166 L55,145 L56,125 L58,115 L59,105Z" fill="url(#land-g)" stroke="#5A8A48" stroke-width="2.5" stroke-linejoin="round" filter="url(#isl-sh)"/>
  <path d="M720,115 L726,109 L734,104 L743,108 L747,117 L740,125 L727,123 L720,115Z" fill="#D8EAC2" stroke="#5A8A48" stroke-width="1.5"/>
  <path d="M147,445 L151,440 L158,444 L154,450 L147,445Z" fill="#D8EAC2" stroke="#5A8A48" stroke-width="1.2"/>
  <path d="M122,183 L127,178 L134,181 L130,188 L122,183Z" fill="#D8EAC2" stroke="#5A8A48" stroke-width="1.2"/>
  <text x="735" y="101" text-anchor="middle" font-size="9" fill="#3A6A28" font-family="sans-serif">우도</text>
  <text x="153" y="437" text-anchor="middle" font-size="8" fill="#3A6A28" font-family="sans-serif">마라도</text>

  <polygon points="369,217 386,250 352,250" fill="#5A8048" opacity=".85"/>

// ── TourAPI 프록시 호출 ──────────────────────
var PROXY_BASE = 'https://yeojung-proxy.vercel.app/api/tourapi';

function tourApiJsonp(ep, params, cb) {
  var qs = '?endpoint=' + ep;
  Object.keys(params).forEach(function(k){
    qs += '&' + k + '=' + encodeURIComponent(params[k]);
  });
  var url = PROXY_BASE + qs;

  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data){
      var items = data && data.response && data.response.body &&
                  data.response.body.items && data.response.body.items.item;
      cb(null, items ? [].concat(items) : []);
    })
    .catch(function(e){ cb(e, []); });
}

function tourApiFetch(ep, params, cb) {
  tourApiJsonp(ep, params, cb);
}

function apiToSpot(it) {
  var lat = parseFloat(it.mapy) || 0;
  var lng = parseFloat(it.mapx) || 0;
  return {
    id: 'api_' + it.contentid,
    name: it.title,
    ct: String(it.contenttypeid || '12'),
    addr: (it.addr1 || '') + (it.addr2 ? ' ' + it.addr2 : ''),
    lat: lat, lng: lng,
    parking: false, wait: '정보없음',
    tip: it.addr1 || 'TourAPI 제공 데이터',
    zone: getZone(lat, lng)
  };
}

function getFilteredDemo() {
  return JEJU_SPOTS.filter(function(s) {
    if (!S.selCt[s.ct]) return false;
    if (S.zone === 'all') return true;
    return s.zone === S.zone;
  });
}

function pickZone(el) {
  document.querySelectorAll('.ztab').forEach(function(t){
    t.classList.remove('on'); t.classList.remove('all-on');
  });
  var z = el.getAttribute('data-z');
  S.zone = z;
  if (z === 'all') el.classList.add('all-on');
  else el.classList.add('on');
  doArea();
}

// ── 검색 / 전체보기 ─────────────────────────
function doSearch() {
  var q = document.getElementById('qInp').value.trim();
  if (!q) { doArea(); return; }
  setStt('검색 중...');
  // 키워드 검색 - contentTypeId 없이 전체 검색 후 필터
  tourApiJsonp('searchKeyword2', {
    keyword: q,
    areaCode: 39,
    numOfRows: 100, pageNo: 1
  }, function(err, items) {
    var all = [];
    if (!err && items) {
      items.forEach(function(it){
        if (it && it.title && parseFloat(it.mapy) && parseFloat(it.mapx)) {
          var s = apiToSpot(it);
          // 권역 필터 (전체면 다 표시)
          if (S.zone === 'all' || s.zone === S.zone) all.push(s);
        }
      });
    }
    // JEJU_SPOTS에서도 검색
    var fixedResults = JEJU_SPOTS.filter(function(s){
      return s.name.indexOf(q) >= 0 || s.addr.indexOf(q) >= 0;
    }).filter(function(s){
      return S.zone === 'all' || s.zone === S.zone;
    });
    fixedResults.forEach(function(s){
      var exists = all.some(function(x){ return x.name === s.name; });
      if (!exists) all.unshift(s);
    });
    if (all.length) {
      setStt('');
      renderList(all);
    } else {
      setStt('"' + q + '" 검색 결과 없음', 'err');
    }
  });
}

function doArea() {
  if (true) {
    setStt('');
    var cts = Object.keys(S.selCt);
    if (!cts.length) cts = ['12'];
    var all = [], done = 0;
    cts.forEach(function(ct) {
      tourApiJsonp('areaBasedList2', {
        areaCode: 39,
        contentTypeId: ct,
        numOfRows: 100, pageNo: 1, arrange: 'P'
      }, function(err, items) {
        if (!err) items.forEach(function(it){
          if (it && it.title && parseFloat(it.mapy) && parseFloat(it.mapx)) {
            var s = apiToSpot(it);
            if (S.zone === 'all' || s.zone === S.zone) all.push(s);
          }
        });
        done++;
        if (done === cts.length) {
          // locationBasedList2로 주변 명소 추가 보강
          var ZONE_LAT = {all:33.38,east:33.46,west:33.39,south:33.25,halla:33.38};
          var ZONE_LNG = {all:126.55,east:126.93,west:126.25,south:126.55,halla:126.53};
          var mapLat = ZONE_LAT[S.zone] || 33.38;
          var mapLng = ZONE_LNG[S.zone] || 126.55;
          tourApiJsonp('locationBasedList2', {
            mapX: mapLng, mapY: mapLat, radius: 20000,
            numOfRows: 50, pageNo: 1, arrange: 'E'
          }, function(err2, items2) {
            if (!err2) items2.forEach(function(it){
              if (it && it.title && parseFloat(it.mapy) && parseFloat(it.mapx)) {
                var s = apiToSpot(it);
                var exists = all.some(function(x){ return x.id === s.id; });
                if (!exists && (S.zone === 'all' || s.zone === S.zone)) all.push(s);
              }
            });
            // syncCache 병합 (API 4 최신 명소)
            if (S._syncCache) {
              S._syncCache.forEach(function(s) {
                var exists = all.some(function(x){ return x.id === s.id; });
                if (!exists && (S.zone === 'all' || s.zone === S.zone)) all.push(s);
              });
            }
            // JEJU_SPOTS(고정 명소)와 TourAPI 결과 병합
          var fixed = getFilteredDemo();
          fixed.forEach(function(s) {
            var exists = all.some(function(x){ return x.name === s.name; });
            if (!exists) all.unshift(s); // 고정 명소를 앞에 추가
          });
          if (all.length) { setStt(''); renderList(all); }
          else { setStt(''); renderList(getFilteredDemo()); }
          });
        }
      });
    });
  } else {
    var res = getFilteredDemo();
    setStt('');
    renderList(res);
  }
}

}

function renderList(items) {

  var order = ['east','west','south','halla'];
  if (S.zone !== 'all') {
    // 선택 권역만 표시
    items = items.filter(function(s){ return s.zone === S.zone; });
  } else {
    items = items.slice().sort(function(a,b){
      return order.indexOf(a.zone) - order.indexOf(b.zone);
    });
  }

  document.getElementById('slist').innerHTML = items.map(function(s) {
    var on = S.selSpots.some(function(x){ return x.id === s.id; });
    var enc = encodeURIComponent(JSON.stringify(s));
    var zc = ZONE_COLORS[s.zone] || '#888';
    var zbg = ZONE_BG[s.zone] || '#eee';
    var ztc = ZONE_TC[s.zone] || '#333';
    return '<div class="si' + (on ? ' on' : '') + '" onclick="toggleSpot(\'' + enc + '\')">' +
      '<div class="sdot" style="' + (S.selSpots.some(function(x){return x.id===s.id;}) ? 'background:#3E6B4A' : '') + '"></div>' +

        '<div class="sn">' + s.name + '</div>' +

        '<span class="szn" style="background:' + zbg + ';color:' + ztc + '">' + ZONE_LABELS[s.zone] + '</span>' +
      '</div></div>';

function toggleSpot(enc) {
  var s = JSON.parse(decodeURIComponent(enc));
  var idx = -1;
  S.selSpots.forEach(function(x,i){ if(x.id === s.id) idx = i; });
  if (idx >= 0) {
    S.selSpots.splice(idx, 1);
  } else if (S.selSpots.length < 8) {
    S.selSpots.push(s);
    // API 3: detailCommon2 — 선택한 명소 상세정보 가져오기
    if (s.id && s.id.startsWith('api_')) {
      var contentId = s.id.replace('api_', '');
      tourApiJsonp('detailCommon2', {
        contentId: contentId, contentTypeId: s.ct || 12,
        defaultYN: 'Y', firstImageYN: 'Y', addrinfoYN: 'Y', overviewYN: 'Y'
      }, function(err, items) {
        if (!err && items && items[0]) {
          var detail = items[0];
          // 상세 팁 업데이트
          S.selSpots.forEach(function(sp) {
            if (sp.id === s.id) {
              if (detail.overview) sp.tip = detail.overview.replace(/<[^>]*>/g,'').slice(0,80);
              if (detail.homepage) sp.homepage = detail.homepage;
            }
          });
        }
      });
    }
  }
  renderBadges();
  document.querySelectorAll('.si').forEach(function(el) {
    var n = el.querySelector('.sn').textContent;
    var on = S.selSpots.some(function(x){ return x.name === n; });
    el.classList.toggle('on', on);
    el.querySelector('.sdot').style.background = on ? '#3E6B4A' : 'var(--bdr)';
  });
}

// NNA: 가장 가까운 다음 명소로 이동 (권역 고려)
// ── 동반자별 명소 점수 가중치 ──────────────
function companionScore(s) {
  var c = S.companion;
  var score = 0;
  // 혼자: 관광지·레포츠 선호, 카페 보통
  if (c === 'solo') {
    if (s.ct === '12') score += 2;
    if (s.ct === '28') score += 1.5;
    if (s.ct === '39') score += 0.5;
  }
  // 커플: 경치·카페·문화시설 선호
  if (c === 'couple') {
    if (s.ct === '12') score += 2;
    if (s.ct === '14') score += 1.5;
    if (s.ct === '39') score += 1.5; // 카페·음식
    if (s.parking) score += 0.5;
  }
  // 친구: 레포츠·맛집·쇼핑 선호
  if (c === 'friends') {
    if (s.ct === '28') score += 2.5;
    if (s.ct === '38') score += 1.5;
    if (s.ct === '39') score += 2;
    if (s.ct === '15') score += 1; // 축제
  }
  // 가족: 관광지·체험·주차 필수
  if (c === 'family') {
    if (s.ct === '12') score += 2;
    if (s.ct === '14') score += 1.5;
    if (s.ct === '28') score += 1;
    if (s.parking) score += 2; // 주차 매우 중요
    if (s.wait && s.wait !== '없음') score -= 1; // 웨이팅 회피
  }
  // 반려동물: 야외 관광지·레포츠, 웨이팅 없는 곳
  if (c === 'pet') {
    if (s.ct === '12') score += 2.5; // 야외 관광지
    if (s.ct === '28') score += 2;   // 레포츠(해변 등)
    if (s.ct === '14') score -= 1;   // 실내 문화시설 불리
    if (s.ct === '38') score -= 1.5; // 쇼핑 불리
    if (s.parking) score += 1.5;
    if (s.wait === '없음') score += 1;
  }
  // 어르신: 주차 필수, 이동 짧게, 웨이팅 없음, 레포츠 회피
  if (c === 'senior') {
    if (s.parking) score += 3;       // 주차 최우선
    if (s.wait === '없음') score += 2;
    if (s.ct === '12') score += 1.5;
    if (s.ct === '14') score += 1;
    if (s.ct === '28') score -= 1.5; // 체력 소모 회피
    if (s.ct === '38') score += 0.5;
  }
  return score;
}

// ── 8가지 우선순위 점수 ──────────────────────
function prioScore(s) {
  var score = 0;
  if (S.prio['경치'] >= 2 && s.ct === '12') score += S.prio['경치'] * 0.8;
  if (S.prio['맛집'] >= 2 && s.ct === '39') score += S.prio['맛집'] * 0.8;
  if (S.prio['카페'] >= 2 && s.ct === '39') score += S.prio['카페'] * 0.5;
  if (S.prio['레포츠'] >= 2 && s.ct === '28') score += (S.prio['레포츠']||1) * 0.8;
  if (S.prio['주차'] >= 2 && s.parking) score += S.prio['주차'] * 0.6;
  if (S.prio['웨이팅'] >= 2 && s.wait !== '없음') score -= S.prio['웨이팅'] * 0.5;
  return score;
}

function optimizeRoute(spots) {
  if (spots.length <= 1) return spots;

  // 동반자 + 우선순위 점수로 정렬 후 상위 명소만 선택
  var scored = spots.map(function(s) {
    return { spot: s, score: companionScore(s) + prioScore(s) };
  });
  scored.sort(function(a,b){ return b.score - a.score; });

  // 상위 명소 우선 선택 (최대 8개)
  var topSpots = scored.slice(0, Math.min(spots.length, 8)).map(function(x){ return x.spot; });

  // NNA(최근접이웃) 알고리즘으로 동선 최적화
  var remaining = topSpots.slice();
  var result = [remaining.splice(0, 1)[0]];
  while (remaining.length) {
    var last = result[result.length - 1];
    var bestIdx = 0, bestDist = Infinity;
    remaining.forEach(function(s, i) {
      var dist = Math.pow(s.lat - last.lat, 2) + Math.pow(s.lng - last.lng, 2);
      // 동선 효율 우선순위 반영
      var effPenalty = S.prio['동선효율'] >= 3 ? dist * 0.3 : 0;
      // 어르신/가족: 이동거리 짧게
      if (S.companion === 'senior' || S.companion === 'family') effPenalty += dist * 0.5;
      if (dist + effPenalty < bestDist) { bestDist = dist + effPenalty; bestIdx = i; }
    });
    result.push(remaining.splice(bestIdx, 1)[0]);
  }
  return result;
}

// ── 타임라인 렌더 ───────────────────────────
function renderTimeline(spots) {
  var w = getSeasonWeather();
  var dateStr = document.getElementById('dateInp').value || '오늘';
  var addMeal = S.prio['맛집'] >= 2, addCafe = S.prio['카페'] >= 2;
  var totalPl = spots.length + (addMeal?1:0) + (addCafe?1:0);
  var hr = 9, hm = 0; // 9:00 시작
  // 하루 최대 21:00 기준, 명소 수 조정
  var MAX_HR = 22;
  var validSpots = [];
  var tempHr = 9;
  spots.forEach(function(s) {
    var dur = (s.ct==='12'||s.ct==='28') ? 90 : 60;
    var endHr = tempHr + Math.ceil(dur/60) + 0.5; // 이동 30분 포함
    if (endHr <= MAX_HR) { validSpots.push(s); tempHr = endHr; }
  });
  if (validSpots.length === 0) validSpots = spots.slice(0, 4);

  var tl = validSpots.map(function(s) {
    var dur = (s.ct==='12'||s.ct==='28') ? 90 : 60;
    var sh = Math.floor(hr);
    var sm = Math.round((hr - sh) * 60);
    var endMin = sm + dur + 30; // 관람 + 이동 30분
    var eh = sh + Math.floor(endMin/60);
    var em = endMin % 60;
    hr = eh + (em/60);
    var stStr = sh + ':' + (sm<10?'0':'')+sm;
    var etStr = sh + ':' + (sm<10?'0':'')+(sm+dur>59?(sm+dur-60):sm+dur<10?'0'+(sm+dur):sm+dur);
    // 간단하게 시간만
    var startH = sh;
    var endH = sh + Math.ceil(dur/60);
    return Object.assign({}, s, {
      st: startH + ':00',
      et: (endH > 23 ? 23 : endH) + ':00'
    });
  });
  spots = validSpots;

  // 권역 정보
  var zones = {};
  spots.forEach(function(s){ zones[s.zone] = (zones[s.zone]||0)+1; });
  var zoneStr = Object.keys(zones).map(function(z){ return ZONE_LABELS[z]+'권역 '+zones[z]+'곳'; }).join(', ');
  var zoneName = S.zone === 'all' ? '제주 전체' : (ZONE_LABELS[S.zone]||'제주')+'권역';

  var h = '<div class="res-t">' + zoneName + ' ' + CMAP[S.companion] + ' 여행</div>';
  h += '<div class="res-s">' + dateStr + ' · ' + totalPl + '개 장소 · ' + zoneStr + '</div>';
  h += '<div class="wbar"><div class="wi"><span style="font-size:17px">' + w.icon + '</span> <strong>' + w.label + ' ' + w.temp + '</strong></div>';
  h += '<div class="wi">☁ ' + w.uv + '</div><div class="wi">💨 ' + w.wind + '</div>';
  h += '<div class="wi" style="color:' + (S.prio['날씨']>=2?'#2E6644':'var(--ink3)') + '">' + (S.prio['날씨']>=2?'✓ ':'') + w.note + '</div></div>';
  h += '<div class="tl">';
  tl.forEach(function(s, i){ h += buildCard(s, i); });
  if (addMeal) h += xCard('🍽','제주 흑돼지/해산물','점심', tl.length, '12:30','13:30','TourAPI 음식점 데이터 연동 시 주변 맛집 자동 추천');
  if (addCafe) h += xCard('☕','제주 뷰카페','카페 휴식', tl.length+(addMeal?1:0), '15:00','15:45','권역 내 뷰 좋은 카페 자동 선택');
  h += '</div>';
  h += '<div class="sgrid">';
  h += '<div class="sc2"><div class="snum">' + totalPl + '</div><div class="slb">총 방문지</div></div>';
  h += '<div class="sc2"><div class="snum">' + spots.filter(function(s){return s.parking;}).length + '</div><div class="slb">주차 가능</div></div>';
  h += '<div class="sc2"><div class="snum">약 ' + Math.round(spots.length*18+10) + 'km</div><div class="slb">예상 이동</div></div>';
  h += '<div class="sc2"><div class="snum">' + Math.round(totalPl*1.5+1.5) + 'h</div><div class="slb">예상 시간</div></div>';
  h += '</div>';
  document.getElementById('resArea').innerHTML = h;
  document.getElementById('resArea').style.display = 'block';
}

  if (S.companion==='pet') companionTag = '<span class="ttag w">🐾 반려동물 동반 확인</span>';

// ── SVG 지도 (제주 좌표 기반) ───────────────
// 제주 좌표 범위: lat 33.10~33.62, lng 126.10~127.00
var JEJU_LAT_MIN = 33.11, JEJU_LAT_MAX = 33.59;
var JEJU_LNG_MIN = 126.14, JEJU_LNG_MAX = 126.99;

function latLngToPx(lat, lng) {
  var W=800, H=460, PADX=40, PADY=25;
  var x = Math.round(PADX + (lng-126.14)/(126.99-126.14)*(W-PADX*2));
  var y = Math.round((H-PADY)+20 - (lat-33.11)/(33.59-33.11)*(H-PADY*2));
  x = Math.max(50, Math.min(750, x));
  y = Math.max(30, Math.min(470, y));
  return {x:x, y:y};
}

function drawMap(spots) {

  var rl = document.getElementById('rlines');
  var mm = document.getElementById('mmarkers');
  rl.innerHTML = ''; mm.innerHTML = '';

  var pts = spots.map(function(s){ return latLngToPx(s.lat, s.lng); });

  // 경로선 (권역 색상)
  if (pts.length > 1) {
    for (var i = 0; i < pts.length - 1; i++) {
      var path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d','M'+pts[i].x+' '+pts[i].y+' L'+pts[i+1].x+' '+pts[i+1].y);

      path.setAttribute('opacity','0.75');

  // 마커
  spots.forEach(function(s, i) {

    tt2.setAttribute('x',tx+tw/2); tt2.setAttribute('y',ty+12);

    tt2.setAttribute('fill','white'); tt2.setAttribute('font-size','11');
    tt2.setAttribute('font-family','sans-serif'); tt2.textContent = lbl;
    tg.appendChild(tt2); g.appendChild(tg);
    g.addEventListener('mouseenter',function(){tg.setAttribute('opacity','1');});
    g.addEventListener('mouseleave',function(){tg.setAttribute('opacity','0');});
    mm.appendChild(g);
  });

  // 범례
  var leg = document.getElementById('mleg');
  leg.innerHTML = spots.map(function(s,i){
    return '<div class="lgi" onclick="focusCard('+i+')">' +
      '<div class="lgd" style="background:'+ZONE_COLORS[s.zone]+'"></div>' +
      '<span>'+(i+1)+'. '+s.name+'</span></div>';
  }).join('');
  leg.classList.add('on');
}

function focusCard(i) {
  showTab('tl', document.getElementById('tabTl'));
  document.querySelectorAll('.tcard').forEach(function(c,j){ c.classList.toggle('hl', j===i); });
  var cards = document.querySelectorAll('.tcard');
  if (cards[i]) cards[i].scrollIntoView({behavior:'smooth',block:'center'});
}

function showMarkerPopup(i, px, py) {
  var s = S.route[i];
  if (!s) return;
  var popup = document.getElementById('detailPopup');
  var svgEl = document.getElementById('msvg');
  var rect = svgEl.getBoundingClientRect();
  var scaleX = rect.width / 800;
  var scaleY = rect.height / 500;
  var left = px * scaleX + rect.left - svgEl.parentElement.getBoundingClientRect().left;
  var top = py * scaleY + svgEl.parentElement.getBoundingClientRect().top - svgEl.parentElement.getBoundingClientRect().top - 100;
  popup.style.left = Math.min(left, rect.width - 230) + 'px';
  popup.style.top = Math.max(10, top) + 'px';
  popup.style.pointerEvents = 'all';
  document.getElementById('dpName').textContent = s.name;
  document.getElementById('dpType').textContent = (CT[s.ct]||s.ct) + ' · ' + ZONE_LABELS[s.zone] + '권역';
  document.getElementById('dpTip').textContent = s.tip || '';
  popup.classList.add('show');
  // detailCommon2 호출해서 팝업 업데이트
  if (s.id && s.id.startsWith('api_')) {
    var contentId = s.id.replace('api_', '');
    tourApiJsonp('detailCommon2', {
      contentId: contentId, defaultYN: 'Y', overviewYN: 'Y'
    }, function(err, items) {
      if (!err && items && items[0] && items[0].overview) {
        document.getElementById('dpTip').textContent = items[0].overview.replace(/<[^>]*>/g,'').slice(0,120) + '...';
      }
    });
  }
  focusCard(i);
}

function closePopup() {
  document.getElementById('detailPopup').classList.remove('show');
}

// ── UI 헬퍼 ─────────────────────────────────
function pick(el, key) {
  document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
  el.classList.add('on');
  S[key] = el.getAttribute('data-v');

  // 동반자에 따라 카테고리 자동 조정
  if (key === 'companion') {
    var c = S[key];
    // 전체 초기화 후 동반자별 체크
    ['12','14','15','28','38','39'].forEach(function(ct){
      S.selCt[ct] = 1;
      var btn = document.querySelector('[data-ct="'+ct+'"]');
      if (btn) btn.classList.add('on');
    });
    // 어르신: 레포츠 제외
    if (c === 'senior') {
      delete S.selCt['28']; delete S.selCt['15'];
      var b28 = document.querySelector('[data-ct="28"]');
      var b15 = document.querySelector('[data-ct="15"]');
      if (b28) b28.classList.remove('on');
      if (b15) b15.classList.remove('on');
    }
    // 반려동물: 쇼핑 제외, 야외 중심
    if (c === 'pet') {
      delete S.selCt['38']; delete S.selCt['14'];
      var b38 = document.querySelector('[data-ct="38"]');
      var b14 = document.querySelector('[data-ct="14"]');
      if (b38) b38.classList.remove('on');
      if (b14) b14.classList.remove('on');
    }
    // 친구: 레포츠·맛집 강조 (전체 유지)
    // 커플: 전체 유지
    // 가족: 전체 유지
  }
}

function toggleCt(el) {
  var ct = el.getAttribute('data-ct');
  if (S.selCt[ct]) delete S.selCt[ct]; else S.selCt[ct] = 1;
  el.classList.toggle('on', !!S.selCt[ct]);
}

function onKey(v) {
  S.apiKey = v.trim();
  var bdg = document.getElementById('kbdg');
  if (S.apiKey.length > 10) { bdg.textContent='키 입력됨 — 연결 확인 클릭'; bdg.className='kbdg'; }
  else { bdg.textContent='데모 모드'; bdg.className='kbdg'; }
}

function showTab(id, btn) {
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('on'); });
  document.querySelectorAll('.pane').forEach(function(p){ p.classList.remove('on'); });
  btn.classList.add('on'); document.getElementById('pane-'+id).classList.add('on');
}

function setPrio(key, val, btn) {
  S.prio[key] = val;
  btn.closest('.pbtns').querySelectorAll('.pbtn').forEach(function(b,i){ b.classList.toggle('on', i+1===val); });
}

// ── INIT ────────────────────────────────────
var PLBLS = {날씨:'🌤 날씨 고려',맛집:'🍽 맛집 포함',카페:'☕ 카페 포함',경치:'🏔 경치 우선',주차:'🚗 주차 편의',웨이팅:'⏱ 웨이팅 최소화',동선효율:'🧭 동선 효율'};
document.getElementById('plist').innerHTML = Object.keys(PLBLS).map(function(k){
  return '<div class="prow"><span class="plbl">'+PLBLS[k]+'</span>'+
    '<div class="pbtns">'+[1,2,3].map(function(n){
      return '<button class="pbtn'+(S.prio[k]===n?' on':'')+'\" onclick="setPrio(\''+k+'\','+n+',this)">'+n+'</button>';
    }).join('')+'</div></div>';
}).join('');
document.getElementById('dateInp').value = new Date().toISOString().split('T')[0];

// 초기 실데이터 로드 (프록시)
doArea();
</script>
